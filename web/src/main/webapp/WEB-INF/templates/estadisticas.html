<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estadísticas - Adivina el Número</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
        }

        h1 {
            color: #667eea;
            text-align: center;
            margin-bottom: 10px;
            font-size: 2.5em;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 40px;
            font-size: 1.1em;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 25px;
            border-radius: 15px;
            text-align: center;
            color: white;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
            transition: transform 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .stat-icon {
            font-size: 2.5em;
            margin-bottom: 10px;
            display: block;
        }

        .stat-label {
            font-size: 0.9em;
            opacity: 0.9;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .stat-value {
            font-size: 2.5em;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        .stat-value.percentage::after {
            content: '%';
            font-size: 0.6em;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            background: #f8f9fa;
            border-radius: 15px;
            margin-bottom: 30px;
        }

        .empty-state-icon {
            font-size: 5em;
            margin-bottom: 20px;
            opacity: 0.5;
        }

        .empty-state h2 {
            color: #666;
            margin-bottom: 15px;
            font-size: 1.8em;
        }

        .empty-state p {
            color: #999;
            font-size: 1.1em;
            margin-bottom: 25px;
        }

        .button-group {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .btn {
            padding: 15px 40px;
            border: none;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        @media (max-width: 600px) {
            .container {
                padding: 25px;
            }

            h1 {
                font-size: 2em;
                flex-direction: column;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }

            .button-group {
                flex-direction: column;
            }
        }

        @media (min-width: 601px) and (max-width: 900px) {
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>
            <span>📊</span>
            <span>Estadísticas</span>
        </h1>
        <p class="subtitle">Tu rendimiento en el juego de Adivina el Número</p>

        <div class="empty-state" th:if="${estadisticas.partidasJugadas == 0}">
            <div class="empty-state-icon">🎮</div>
            <h2>¡Aún no has jugado!</h2>
            <p>Empieza a jugar para ver tus estadísticas aquí</p>
        </div>

        <div th:if="${estadisticas.partidasJugadas > 0}">
            <div class="stats-grid">
                <div class="stat-card">
                    <span class="stat-icon">🎯</span>
                    <div class="stat-label">Partidas Jugadas</div>
                    <div class="stat-value" th:text="${estadisticas.partidasJugadas}">0</div>
                </div>

                <div class="stat-card">
                    <span class="stat-icon">🏆</span>
                    <div class="stat-label">Victorias</div>
                    <div class="stat-value" th:text="${estadisticas.partidasGanadas}">0</div>
                </div>

                <div class="stat-card">
                    <span class="stat-icon">📈</span>
                    <div class="stat-label">% de Victorias</div>
                    <div class="stat-value percentage" th:text="${#numbers.formatDecimal(estadisticas.porcentajeGanadas, 1, 1)}">0.0</div>
                </div>

                <div class="stat-card">
                    <span class="stat-icon">💔</span>
                    <div class="stat-label">Derrotas</div>
                    <div class="stat-value" th:text="${estadisticas.partidasJugadas - estadisticas.partidasGanadas}">0</div>
                </div>
            </div>
        </div>

        <div class="button-group">
            <a href="/web_war_exploded" class="btn btn-primary">🏠 Inicio</a>
        </div>
    </div>
</body>
</html>
