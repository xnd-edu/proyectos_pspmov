<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adivina el Número</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 500px;
            width: 100%;
        }

        h1 {
            color: #667eea;
            text-align: center;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
        }

        .game-info {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 25px;
            text-align: center;
        }

        .intentos {
            font-size: 1.3em;
            color: #333;
            font-weight: bold;
        }

        .intentos-number {
            color: #667eea;
            font-size: 1.5em;
        }

        .mensaje {
            background: #fff3e0;
            color: #ef6c00;
            border-left: 4px solid #ef6c00;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 25px;
            text-align: center;
            font-size: 1.1em;
            font-weight: 500;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 1.1em;
        }

        input[type="number"] {
            width: 100%;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1.2em;
            text-align: center;
            transition: all 0.3s;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            flex: 1;
            padding: 15px 30px;
            border: none;
            border-radius: 8px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(108, 117, 125, 0.4);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .instrucciones {
            margin-top: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 8px;
            text-align: center;
        }

        .instrucciones p {
            color: #666;
            margin: 5px 0;
        }

        .numero-secreto {
            font-size: 2em;
            color: #667eea;
            font-weight: bold;
        }

        @media (max-width: 600px) {
            .container {
                padding: 25px;
            }

            h1 {
                font-size: 2em;
            }

            .button-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎯 Adivina el Número</h1>
        <p class="subtitle" th:if="${usuario}">¡Hola, <span th:text="${usuario}">Jugador</span>!</p>
        <p class="subtitle" th:unless="${usuario}">¡Encuentra el número secreto entre 1 y 100!</p>

        <div class="game-info">
            <p class="intentos">
                Intentos restantes: <span class="intentos-number" th:text="${juego.intentosRestantes}">10</span>
            </p>
        </div>

        <div th:if="${mensaje}"
             th:class="${'mensaje warning'}"
             th:text="${mensaje}">
            Mensaje del juego
        </div>

        <form method="post">
            <div class="form-group">
                <label for="intento">Introduce tu número:</label>
                <input type="number"
                       id="intento"
                       name="intento"
                       min="1"
                       max="100"
                       required
                       autofocus
                       placeholder="1 - 100">
            </div>

            <div class="button-group">
                <button type="submit" class="btn-primary">Intentar</button>
            </div>
        </form>

        <div class="instrucciones">
            <p><strong>Instrucciones:</strong></p>
            <p th:text="${instrucciones}">Tienes X intentos para adivinar el número secreto.</p>
            <p>Te diré si el número es mayor o menor después de cada intento.</p>
        </div>
    </div>
</body>
</html>
