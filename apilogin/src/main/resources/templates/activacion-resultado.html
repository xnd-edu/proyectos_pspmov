<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activación de Cuenta</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 60px 40px;
            text-align: center;
            max-width: 500px;
            width: 100%;
        }

        .icon {
            font-size: 80px;
            margin-bottom: 20px;
        }

        .exitoso .icon {
            color: #4CAF50;
        }

        .error .icon {
            color: #f44336;
        }

        h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 15px;
        }

        .exitoso h1 {
            color: #4CAF50;
        }

        .error h1 {
            color: #f44336;
        }

        p {
            color: #666;
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .usuario {
            font-weight: bold;
            color: #667eea;
            font-size: 18px;
            margin: 20px 0;
        }

        .btn {
            display: inline-block;
            padding: 15px 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: bold;
            transition: transform 0.3s, box-shadow 0.3s;
            margin-top: 10px;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        .footer {
            margin-top: 40px;
            color: #999;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container" th:classappend="${exitoso} ? 'exitoso' : 'error'">
        <div class="icon" th:text="${exitoso} ? '✓' : '✗'">✓</div>

        <h1 th:text="${exitoso} ? '¡Cuenta Activada!' : 'Error de Activación'">¡Cuenta Activada!</h1>

        <div th:if="${exitoso}">
            <p th:text="${mensaje}">¡Tu cuenta ha sido activada exitosamente!</p>
            <p class="usuario">¡Bienvenido, <span th:text="${usuario}">Usuario</span>!</p>
            <p>Ya puedes iniciar sesión con tus credenciales.</p>
            <a href="/login" class="btn">Ir a Login</a>
        </div>

        <div th:if="${!exitoso}">
            <p th:text="${mensaje}">Error al activar la cuenta.</p>
            <p>Por favor, verifica el enlace o contacta con soporte.</p>
            <a href="/" class="btn">Volver al Inicio</a>
        </div>

        <div class="footer">
            <p>&copy; 2025 Tu Aplicación</p>
        </div>
    </div>
</body>
</html>
